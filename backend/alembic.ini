[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# py_template = alembic:script.py.mako

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library that can be
# installed by installing `alembic` with the `[tz]` option
# i.e.:    pip install -U alembic[tz]
# timezone =

# max length of characters to apply to the
# "caveat" field when rendering the migration file
# max_caveat_len = 50

# The output encoding used when writing files
# output_encoding = utf-8

sqlalchemy.url = postgresql://postgres:password@localhost:5432/crime_reporting

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
hand
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
#format = %(levelname)-5.5s [%(name)s] %(asctime)s %(message)s